# Start iperf3 manually for each lab session, as described in README.md.
if command -v ip >/dev/null 2>&1; then lab4_ip() { ip "$@"; }; else lab4_ip() { /gns3/bin/busybox ip "$@"; }; fi
lab4_ip link set eth0 up
lab4_ip addr flush dev eth0
lab4_ip addr add 10.20.20.20/24 dev eth0
lab4_ip route replace default via 10.20.20.1 dev eth0
