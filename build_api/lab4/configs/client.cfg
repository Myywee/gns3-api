# Each executable line is joined into the Docker Start command by the builder.
if command -v ip >/dev/null 2>&1; then lab4_ip() { ip "$@"; }; else lab4_ip() { /gns3/bin/busybox ip "$@"; }; fi
lab4_ip link set eth0 up
lab4_ip addr flush dev eth0
lab4_ip addr add 10.10.10.10/24 dev eth0
lab4_ip route replace default via 10.10.10.1 dev eth0
