# client1 继承实验一完成态，启用本地 dnsmasq 缓存。
/gns3/bin/busybox ip link set eth0 up
/gns3/bin/busybox ip addr flush dev eth0
/gns3/bin/busybox ip addr add 10.10.30.10/24 dev eth0
/gns3/bin/busybox ip route replace default via 10.10.30.1 dev eth0
printf 'nameserver 127.0.0.1\noptions timeout:2 attempts:2\n' > /etc/resolv.conf
pgrep -x dnsmasq >/dev/null || dnsmasq
