# dns-server-lab2-complete 提供实验二所需的完整 BIND 配置。
/gns3/bin/busybox ip link set eth0 up
/gns3/bin/busybox ip addr flush dev eth0
/gns3/bin/busybox ip addr add 10.10.20.10/24 dev eth0
/gns3/bin/busybox ip route replace default via 10.10.20.1 dev eth0
printf 'nameserver 127.0.0.1\noptions timeout:2 attempts:2\n' > /etc/resolv.conf
pgrep -x named >/dev/null || /usr/sbin/named -u bind -c /etc/bind/named.conf
