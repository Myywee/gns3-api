# administrator 沿用管理网地址并直接查询实验 DNS。
/gns3/bin/busybox ip link set eth0 up
/gns3/bin/busybox ip addr flush dev eth0
/gns3/bin/busybox ip addr add 10.10.10.10/24 dev eth0
/gns3/bin/busybox ip route replace default via 10.10.10.1 dev eth0
printf 'nameserver 10.10.20.10\noptions timeout:2 attempts:2\n' > /etc/resolv.conf
