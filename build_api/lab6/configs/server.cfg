# Start the Echo programs manually as described in the experiment document.
if command -v ip >/dev/null 2>&1; then lab6_ip() { ip "$@"; }; else lab6_ip() { /gns3/bin/busybox ip "$@"; }; fi
lab6_ip link set eth0 up
lab6_ip addr flush dev eth0
lab6_ip addr add 10.20.20.20/24 dev eth0
lab6_ip route replace default via 10.20.20.1 dev eth0
