# web-server-lab1-complete 镜像提供实验完成态的 nginx 配置。
/gns3/bin/busybox ip link set eth0 up
/gns3/bin/busybox ip addr flush dev eth0
/gns3/bin/busybox ip addr add 10.10.20.20/24 dev eth0
/gns3/bin/busybox ip route replace default via 10.10.20.1 dev eth0
printf 'nameserver 10.10.20.10\noptions timeout:2 attempts:2\n' > /etc/resolv.conf
nginx -t && (pgrep -x nginx >/dev/null && nginx -s reload || nginx)
